<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@500;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; background: #161616; }
  #stage { width: 1080px; height: 1920px; position: relative; overflow: hidden; background: #161616; }
  .scene { position: absolute; inset: 0; display: none; overflow: hidden; }
  .anton { font-family: 'Anton', sans-serif; }
  .serif { font-family: 'Instrument Serif', serif; font-style: italic; }
  .sans { font-family: 'Inter Tight', sans-serif; font-weight: 600; }
  .abs { position: absolute; }
</style>
</head>
<body>
<div id="stage">

  <!-- S1 : couverture photo -->
  <div class="scene" id="s1">
    <img id="s1img" src="etudiante.jpg" class="abs" style="left:0;top:0;width:1080px;height:1920px;object-fit:cover;object-position:56% 50%;transform-origin:56% 40%">
    <div class="abs" style="left:0;bottom:0;width:1080px;height:1150px;background:linear-gradient(0deg,rgba(10,10,12,.94) 38%,rgba(10,10,12,0) 100%)"></div>
    <div class="abs" style="left:64px;right:120px;top:980px">
      <div id="s1a" class="anton" style="display:inline-block;background:#FF5A1F;color:#161616;padding:4px 26px 0;font-size:250px;line-height:1;letter-spacing:-3px;transform-origin:0 100%">79&nbsp;%</div>
      <div id="s1b" class="serif" style="color:#FFF3E2;font-size:112px;line-height:.98;margin-top:28px">des étudiants font leurs devoirs</div>
      <div id="s1c" class="anton" style="color:#FFF3E2;font-size:170px;line-height:.95">AVEC L'IA</div>
    </div>
  </div>

  <!-- S2 : 79 % -->
  <div class="scene" id="s2" style="background:#161616">
    <div class="abs" style="left:64px;right:120px;top:560px">
      <div id="s2t" class="serif" style="color:#FFF3E2;font-size:100px;line-height:1">Le chiffre</div>
      <div id="s2n" class="anton" style="color:#FF5A1F;font-size:420px;line-height:1;letter-spacing:-6px;margin-top:20px">79&nbsp;%</div>
      <div id="s2l" class="sans" style="color:#FFF3E2;font-size:58px;line-height:1.2">utilisent l'IA pour leurs devoirs</div>
    </div>
  </div>

  <!-- S3 : 47 % -->
  <div class="scene" id="s3" style="background:#161616">
    <div class="abs" style="left:64px;right:120px;top:560px">
      <div id="s3t" class="serif" style="color:#FFF3E2;font-size:100px;line-height:1">Mais seulement</div>
      <div id="s3n" class="anton" style="color:#FFF3E2;font-size:420px;line-height:1;letter-spacing:-6px;margin-top:20px">47&nbsp;%</div>
      <div id="s3l" class="sans" style="color:#FFF3E2;font-size:58px;line-height:1.2">disent qu'on leur a appris à s'en servir</div>
    </div>
  </div>

  <!-- S4 : polaroid -->
  <div class="scene" id="s4" style="background:#E8E4D8">
    <div id="s4p" class="abs" style="left:110px;top:300px;width:860px;background:#fff;padding:24px;box-shadow:0 14px 0 rgba(22,22,22,.12)">
      <img src="nuit.jpg" style="width:812px;height:620px;object-fit:cover;display:block">
      <div class="abs" style="left:50%;top:-20px;width:180px;height:44px;margin-left:-90px;background:rgba(230,220,195,.92);transform:rotate(2deg)"></div>
    </div>
    <div class="abs" style="left:64px;right:120px;top:1110px">
      <div id="s4a" class="anton" style="color:#161616;font-size:176px;line-height:.92;letter-spacing:-1px">UN SUR TROIS</div>
      <div id="s4b" class="serif" style="color:#161616;font-size:120px;line-height:1">se débrouille seul.</div>
    </div>
  </div>

  <!-- S5 : et toi -->
  <div class="scene" id="s5" style="background:#FF5A1F">
    <div class="abs" style="left:64px;right:120px;top:600px">
      <div id="s5a" class="anton" style="color:#161616;font-size:250px;line-height:.85;letter-spacing:-3px;white-space:nowrap;transform-origin:0 50%">ET TOI&nbsp;?</div>
      <div id="s5b" class="serif" style="color:#161616;font-size:116px;line-height:1;margin-top:40px">Tu fais partie des 79&nbsp;%&nbsp;?</div>
      <div id="s5c" class="sans" style="color:#161616;font-size:52px;line-height:1.3;margin-top:40px">Dis-le en commentaire.</div>
    </div>
  </div>

</div>
<script>
const B = 60/115;               // durée d'un temps
const S = [0, 8*B, 16*B, 24*B, 32*B, 40*B]; // bornes des scènes
const clamp = (x)=>Math.max(0,Math.min(1,x));
const eo = (x)=>1-Math.pow(1-clamp(x),3);
const back = (x)=>{x=clamp(x);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);};
const $ = (id)=>document.getElementById(id);
function inUp(el,t,start,dur=0.35,dist=80){const p=eo((t-start)/dur);el.style.opacity=p;el.style.transform=`translateY(${(1-p)*dist}px)`;}
function pop(el,t,start,dur=0.4,extra=''){const p=back((t-start)/dur);el.style.opacity=clamp((t-start)/0.12);el.style.transform=`scale(${0.6+0.4*p}) ${extra}`;}
function count(el,t,start,dur,to){const p=eo((t-start)/dur);el.textContent=Math.round(to*p)+' %';}
window.DURATION = S[5];
window.render = function(t){
  for(let i=1;i<=5;i++) $('s'+i).style.display = (t>=S[i-1] && t<S[i]) || (i===5 && t>=S[4]) ? 'block':'none';
  // S1
  if(t<S[1]){
    const z=1.12-0.10*clamp(t/S[1]); $('s1img').style.transform=`scale(${z})`;
    pop($('s1a'),t,B*1,0.45,'rotate(-2deg)');
    inUp($('s1b'),t,B*3); inUp($('s1c'),t,B*5,0.3,120);
  } else if(t<S[2]){ const l=t-S[1];
    inUp($('s2t'),l,0,0.3,40); $('s2n').style.opacity=1; count($('s2n'),l,B*1,B*3,79); inUp($('s2l'),l,B*4);
  } else if(t<S[3]){ const l=t-S[2];
    inUp($('s3t'),l,0,0.3,40); count($('s3n'),l,B*1,B*3,47); inUp($('s3l'),l,B*4);
  } else if(t<S[4]){ const l=t-S[3];
    const p=back(l/0.55); $('s4p').style.transform=`translateY(${(1-p)*-900}px) rotate(${-2.5*p+8*(1-p)}deg)`;
    inUp($('s4a'),l,B*2,0.3,100); inUp($('s4b'),l,B*4);
  } else { const l=t-S[4];
    pop($('s5a'),l,0,0.45); inUp($('s5b'),l,B*2); inUp($('s5c'),l,B*4,0.35,40);
  }
};
render(0);
</script>
</body>
</html>
